
<div class="mat-new">
  <h4 class="card-heading"> 
    <button mat-icon-button (click)="goBack()" ><mat-icon>chevron_left</mat-icon> </button> Home <span class="sub-menu1"> > Upcoming Events </span> <span class="sub-menu1"> >
      {{pageName}}</span>
  </h4>
</div>
<mat-card>
  <div class="top-br">
    <form [formGroup]="addEventForm">     
      <div class="row">

        <div class="form-group col-md-6" >
          <label for="date">Date<span class="required">*</span></label>
          <input id="date" #scheduleDate  type="date" [min]="minDate"  class="form-control" (change)="dateChanged($event)" formControlName="date" > 
          <span  class="validation_msg"  *ngIf="f.date.touched && f.time.invalid" >Please Select Date</span>
        </div>

        <div class="form-group col-md-3" >
          <label for="hours">Hours</label>
          <select type="date" id="hours" #scheduleHours [disabled]="!date_time" class="form-control" (change)="hoursSelected($event)" >
            <option value="" selected hidden disabled >--</option>
            <option *ngFor="let h of hours" [value]="h" [disabled]="minHours>h" >{{h}}</option>
          </select>
        </div>

        <div class="form-group col-md-3" >
          <label for="minutes">Minutes</label>
          <select id="minutes" #scheduleMinutes class="form-control" [disabled]="!date_time" (change)="minutesSelected($event)">
            <option value="" selected hidden disabled >--</option>
            <option *ngFor="let m of minutes" [value]="m" [disabled]="minMinutes>m">{{m}} </option>
          </select>
        </div>
      </div>
      
      <div class="row">     
        <div class="form-group col-md-6">
          <label for="title">Event Name <span class="char-count" >({{titleLength}}/100)</span><span class="required">*</span></label>
          <input type="text" id="title" class="form-control"  maxlength="100" placeholder="Maximum 100 Characters" required formControlName="title"  (input)="charCount($event,'title')" >
          <span  class="validation_msg"  *ngIf="f.title.touched && f.title.invalid" >Please Enter Title</span>
        </div>        
      </div>
      
      <div class="row">
        <div class="form-group col-md-12">
          <label for="title">Description <span class="char-count" >   ({{descLength}}/500)  </span> <span class="required">*</span></label>
          <textarea class="form-control" maxlength="500"  placeholder="Maximum 500 Characters" required formControlName="description"  (input)="charCount($event,'description')"></textarea>
          <span  class="validation_msg"  *ngIf="f.description.touched && f.description.invalid" >Please Enter Description</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Image (Optional)</label> 
        <input #file type="file" accept="image/*" (change)="onSelectImage($event)" id="image"> 
        <span  class="size_info">Max Image Size 50 MB. (Image size must be  200px * 150px)</span>
        <div *ngIf="previewImg" class="preview_image"> <img [src]="previewImg" alt=""></div> 
      </div>
      
      <div class="row">
        <div class="form-group col-md-12">
         <label for="isGcEvent">  <input type="checkbox" formControlName="isGcEvent" name="" id="isGcEvent"> Is for Officer Cadet </label> 
         </div>
      </div>
      
      <div class="row">
        <div class="form-group col-md-6">       
        <label for="status" class="form-label">Status <span class="required">*</span></label>
          <select name="" id="status" class="form-control" required formControlName="status" >
            <option value="" disabled selected hidden >Select</option>
            <option value="1">Active</option>
            <option value="0">Inactive</option>
          </select>
          <span  class="validation_msg"  *ngIf="f.status.touched && f.status.invalid" >*Please Select Status</span>
        </div>
      </div>

      <button mat-raised-button *ngIf="!id" (click)="addEvent()" >Add Event</button>
      <button mat-raised-button *ngIf="id" (click)="updateEvent()" >Update Event</button>

    </form>
  </div>
</mat-card>
